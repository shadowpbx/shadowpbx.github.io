<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Tanvir Hussain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <style>
        :root {
            --bg-page: #fcfcfd; --accent: #8e44ad; --text-primary: #0f172a; --text-secondary: #475569; --border: #e2e8f0;
            --font-main: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
        }
        html {
            scrollbar-gutter: stable;
        }

        body { background-color: var(--bg-page); color: var(--text-primary); font-family: var(--font-main); margin: 0; padding: 0; line-height: 1.7; -webkit-font-smoothing: antialiased; }
        .container { max-width: 750px; margin: 0 auto; padding: 4rem 1.5rem; }
        header { margin-bottom: 4rem; border-bottom: 1px solid var(--border); padding-bottom: 2rem; }
        .back-link { font-family: var(--font-mono); font-size: 0.85rem; text-decoration: none; color: var(--accent); font-weight: 700; display: inline-block; margin-bottom: 2rem; }
        h1 { font-family: var(--font-main); font-size: 2.5rem; margin: 0; font-weight: 700; letter-spacing: -0.03em; }
        .post-date { font-family: var(--font-mono); font-size: 0.9rem; color: var(--text-secondary); margin-top: 1rem; }
        main { font-size: 1.15rem; color: var(--text-secondary); }
        main h2 { font-family: var(--font-main); color: var(--text-primary); margin-top: 3rem; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
        
        /* TECHNICAL INLINE CODE (Professional Indigo-Purple) */
        :not(pre) > code {
            font-family: var(--font-mono) !important;
            background-color: #f5f3ff !important; /* Very Light Purple Background */
            color: #4338ca !important; /* Deep Professional Indigo-Purple Text */
            padding: 0.2rem 0.4rem !important;
            border-radius: 6px !important;
            font-size: 0.85em !important;
            font-weight: 700 !important;
            border: 1px solid #e0e7ff !important;
            white-space: nowrap !important;
            text-decoration: none !important;
        }

        /* CODE BLOCKS */
        pre[class*="language-"] { background: #1e293b !important; padding: 1.5rem !important; border-radius: 12px !important; margin: 2rem 0 !important; border: 1px solid #334155 !important; }
        code[class*="language-"] { font-family: var(--font-mono) !important; font-size: 0.95rem !important; text-shadow: none !important; text-decoration: none !important; }
        
        /* TABLES */
        main table { width: 100%; border-collapse: collapse; margin: 4rem 0; font-size: 1.05rem; }
        main th { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-primary); padding: 1rem; border-bottom: 2px solid var(--text-primary); text-align: left; }
        main td { padding: 1.25rem 1rem; border-bottom: 1px solid #cbd5e1; color: var(--text-secondary); }
        main tr:nth-child(even) td { background-color: #f1f5f9; }
        main tr:last-child td { border-bottom: none; }
        main td:first-child { font-weight: 600; color: var(--text-primary); }
        main td code { font-size: 0.85em !important; background: #e2e8f0 !important; border: none !important; }

        footer { margin-top: 6rem; padding-top: 2rem; border-top: 1px solid var(--border); text-align: center; font-family: var(--font-mono); font-size: 0.8rem; color: #94a3b8; }
    
        @media (max-width: 768px) {
            .container {
                padding: 2rem 1rem;
            }
            .back-link {
                margin-bottom: 1rem;
            }
            header {
                margin-bottom: 2rem;
                padding-bottom: 1rem;
            }
            h1 {
                font-size: clamp(1.6rem, 5vw, 2.2rem) !important;
                line-height: 1.3;
            }
            main {
                font-size: 1.05rem;
            }
        }
    
        
        
        /* Premium Breadcrumb Widget styling */
        .breadcrumb-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 0.5rem 0.85rem;
            border-radius: 6px;
            margin-bottom: 2.5rem;
        }

        .breadcrumb-left {
            display: flex;
            align-items: center;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none; /* Hide scrollbar Firefox */
            -ms-overflow-style: none;  /* Hide scrollbar IE/Edge */
            padding-right: 1rem;
            margin-right: 0.5rem;
            color: var(--text-secondary);
        }

        .breadcrumb-left::-webkit-scrollbar {
            display: none; /* Hide scrollbar Chrome/Safari */
        }

        .breadcrumb-left a, .breadcrumb-right a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
            white-space: nowrap;
        }

        .breadcrumb-left a:hover, .breadcrumb-right a:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .bc-sep {
            color: #cbd5e1;
            margin: 0 0.4rem;
            flex-shrink: 0;
        }

        .breadcrumb-curr {
            color: var(--text-primary);
            font-weight: 600;
            flex-shrink: 0;
        }

        .breadcrumb-right {
            display: flex;
            gap: 1rem;
            flex-shrink: 0;
        }

        /* Fix mobile horizontal scrolling overflow issues */
        body {
            overflow-x: hidden;
        }
        
        pre[class*="language-"] {
            overflow-x: auto !important;
        }

        @media (max-width: 768px) {
            .breadcrumb-nav {
                padding: 0.5rem 0.75rem;
            }
            :not(pre) > code {
                white-space: normal !important;
                word-break: break-all !important;
            }
            main table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="breadcrumb-nav"><div class="breadcrumb-left"><a href="/">~</a> <span class="bc-sep">/</span> <a href="/Cybersecurity/">cybersecurity</a> <span class="bc-sep">/</span> <a href="/Cybersecurity_Study/">curriculum</a> <span class="bc-sep">/</span> <span class="breadcrumb-curr">{{ title }}</span></div><div class="breadcrumb-right"><a href="/">[ HOME ]</a><a href="/resume/">[ RESUME ]</a></div></div>
        <header><h1>{{ title }}</h1></header>
        <main>{{ content }}</main>
        <footer>&copy; 2026 // TANVIR HUSSAIN // SYSTEMS ARCHITECT</footer>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</body>
</html>
